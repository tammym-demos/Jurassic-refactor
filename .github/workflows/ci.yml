name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm exec vitest run --reporter=verbose

      - name: Run e2e tests
        run: pnpm exec vitest run packages/agents/src/__tests__/e2e.test.ts --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: coverage/

  schema-validation:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all schemas
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const schemaDir = 'specs/schemas';
            const files = fs.readdirSync(schemaDir).filter(f => f.endsWith('.schema.json'));
            let failed = 0;
            for (const file of files) {
              try {
                JSON.parse(fs.readFileSync(path.join(schemaDir, file), 'utf8'));
                console.log('✓', file);
              } catch (e) {
                console.error('✗', file, e.message);
                failed++;
              }
            }
            console.log(\"\nValidated \" + files.length + \" schemas, \" + failed + \" failed\");
            if (failed) process.exit(1);
          "

  determinism-check:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determinism check — agents produce stable output
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const hashDir = (dir) => {
              if (!fs.existsSync(dir)) return 'missing';
              const files = fs.readdirSync(dir, { recursive: true })
                .filter(f => fs.statSync(dir + '/' + f).isFile())
                .sort();
              const h = crypto.createHash('sha256');
              for (const f of files) h.update(fs.readFileSync(dir + '/' + f));
              return h.digest('hex');
            };
            const hash1 = hashDir('packages/agents/dist');
            // Rebuild and compare
            require('child_process').execSync('pnpm --filter @jurassic/agents run build', { stdio: 'inherit' });
            const hash2 = hashDir('packages/agents/dist');
            if (hash1 !== hash2) {
              console.error('Determinism check failed: agent build output differs between runs');
              process.exit(1);
            }
            console.log('✓ Agent build output is deterministic (sha256: ' + hash1.slice(0, 12) + '...)');
          "
