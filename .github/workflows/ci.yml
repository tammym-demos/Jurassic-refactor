name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm exec vitest run --reporter=verbose

      - name: Run e2e tests
        run: pnpm exec vitest run packages/agents/src/__tests__/e2e.test.ts --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: coverage/

  schema-validation:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all schemas
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const schemaDir = 'specs/schemas';
            const files = fs.readdirSync(schemaDir).filter(f => f.endsWith('.schema.json'));
            let failed = 0;
            for (const file of files) {
              try {
                JSON.parse(fs.readFileSync(path.join(schemaDir, file), 'utf8'));
                console.log('✓', file);
              } catch (e) {
                console.error('✗', file, e.message);
                failed++;
              }
            }
            console.log(\"\nValidated \" + files.length + \" schemas, \" + failed + \" failed\");
            if (failed) process.exit(1);
          "

  determinism-check:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determinism check — agents produce stable output
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const hashDir = (dir) => {
              if (!fs.existsSync(dir)) return 'missing';
              const files = fs.readdirSync(dir, { recursive: true })
                .filter(f => fs.statSync(dir + '/' + f).isFile())
                .sort();
              const h = crypto.createHash('sha256');
              for (const f of files) h.update(fs.readFileSync(dir + '/' + f));
              return h.digest('hex');
            };
            const hash1 = hashDir('packages/agents/dist');
            // Rebuild and compare
            require('child_process').execSync('pnpm --filter @jurassic/agents run build', { stdio: 'inherit' });
            const hash2 = hashDir('packages/agents/dist');
            if (hash1 !== hash2) {
              console.error('Determinism check failed: agent build output differs between runs');
              process.exit(1);
            }
            console.log('✓ Agent build output is deterministic (sha256: ' + hash1.slice(0, 12) + '...)');
          "
