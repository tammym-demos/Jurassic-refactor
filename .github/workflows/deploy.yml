name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - staging
          - production
      run_id:
        description: 'Agent run ID to deploy'
        required: true
        type: string
      enable_writes:
        description: 'Enable write operations'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests before deployment
        run: pnpm exec vitest run
      - name: Validate schemas
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'specs/schemas';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.schema.json'));
          files.forEach(f => { JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')); console.log('✓', f); });
          console.log('All', files.length, 'schemas valid');
          "

  approval:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Approval gate passed
        run: echo "Deployment to ${{ inputs.environment }} approved"

  deploy:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Azure Login
        uses: azure/login@a457da92d8c41b8abde199f7302e3bbee395107c # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Container App
        if: inputs.environment == 'production'
        run: |
          echo "Deploying run ${{ inputs.run_id }} to production"
          echo "Write operations enabled: ${{ inputs.enable_writes }}"
          # Deployment would be handled by the hosting service
      - name: Deploy to Staging
        if: inputs.environment == 'staging'
        run: |
          echo "Deploying run ${{ inputs.run_id }} to staging"
